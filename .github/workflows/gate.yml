# THE GATE — the independent witness that release:gate passes on a clean machine.
# ============================================================================
# WHY THIS FILE EXISTS (audit finding P1-9, 2026-08-06). `release:gate` was
# defined in package.json and referenced NOWHERE else: no workflow, no git hook,
# no deploy step (.replit's only postBuild is `pnpm store prune`). Every guard in
# this repo — 39 studio + 21 api — was advisory in practice, enforced by one
# human remembering.
#
# AND IT COULD NOT HAVE BEEN RUN HERE ANYWAY. Measured 2026-08-06 on the
# founder's Windows box: `release:gate` failed at its last step for TWO
# independent environment reasons —
#   ① `PORT=5173 BASE_PATH=/ pnpm run build` is POSIX inline env, and pnpm runs
#      scripts through cmd.exe on Windows → «'PORT' n'est pas reconnu».
#   ② even exported, Git Bash rewrites `BASE_PATH=/` into `C:/Program Files/Git/`,
#      which poisoned index.html with `src="/Program Files/Git/assets/…"`.
# (guard-admin-dist CAUGHT ②, correctly — the guard worked, the environment fed
# it garbage.) Both faults are gone: the root `build:release` script now sets
# both values INSIDE node, so they never pass through a shell. This job is
# therefore the first place the whole gate has ever run end to end.
#
# THE DIVISION OF LABOUR (founder decision, 2026-08-06 — "① + ②"):
#   · the local pre-push hook (.githooks/pre-push) BLOCKS — nothing red leaves
#     the machine;
#   · THIS job WITNESSES — it proves the gate passes on a clean Linux runner and
#     that the hook was not skipped with --no-verify.
# Neither replaces the other. The hook can be bypassed; this cannot be silenced.
#
# ⛔ COST — CORRECTED 2026-08-06. This file first shipped reasoning that the
# repository is PRIVATE and that these minutes are billed. THAT WAS WRONG: the
# repo is PUBLIC, and GitHub Actions is free and unmetered on public repos.
# The error came from inferring "private" off a DOC FILENAME
# (SLICE_2_19A_PRIVATE_REPO_FOUNDATION_VERIFICATION_REPORT.md) instead of
# checking — the exact "no inference from filenames" rule the 2026-08-06 audit
# imposed on all fifteen of its agents. `concurrency` and `timeout-minutes`
# stay: they are good hygiene and they keep a runaway from spinning, but they
# are NOT protecting a bill. There is no bill.
#
# NO SECRETS are needed: the api guard chain was measured hermetic — it ran
# green with DATABASE_URL unset (21 guards, 196,950 bytes, exit 0), and every
# "network" line in its output asserts a CONFIGURED ENDPOINT STRING rather than
# making a live call. Runtime: ~66 s of work measured locally.
#
# ⛔ WHY THE GATE STEP WRAPS ITS OWN FAILURE (run #1, 2026-08-06). Workflow LOGS
# require admin rights — `GET /actions/runs/{id}/logs` answers
# «Must have admin rights to Repository» to everyone else. Step CONCLUSIONS and
# ANNOTATIONS are public. So a bare `exit 1` is undiagnosable by anyone without
# admin, which is how run #1 left its real cause invisible. The wrapper below
# re-emits the failing tail as ::error:: annotations, which ARE public — so
# every future red is readable from the outside without duplicating
# release:gate's step list here.
#
# ⛔ WHAT THIS DOES NOT DO. It runs the guards that exist; it does not make any
# of them stronger. The 2026-08-06 audit found several studio money/share guards
# are SELF-NAMING text scans that measure the file they were told to rather than
# what ships. This job will run those faithfully and they will keep passing.
# "Nobody runs the gate" is closed here. "Some guards cannot go red" is not.
# ============================================================================

name: gate

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref. A newer push cancels the older run instead of paying for both.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # ~66 s of work measured locally; 10 is a runaway cap, not a target.
    timeout-minutes: 10

    steps:
      # Majors current as of 2026-08-06, each read from its own
      # /releases/latest — not from memory. Run #1 warned that the previous
      # pins (checkout@v4, setup-node@v4, action-setup@v4) all target Node 20,
      # which GitHub has deprecated and was force-running on Node 24.
      - uses: actions/checkout@v7

      # Reads the version from package.json's `packageManager` field
      # (pnpm@10.26.1) — never a second copy of that number here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Matches .replit's `nodejs-24`.
          node-version: 24
          cache: pnpm

      # --frozen-lockfile: the lockfile decides, nothing re-resolves. This also
      # satisfies the root `preinstall` guard, which refuses any non-pnpm agent.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The repo's OWN gate, invoked whole. Deliberately NOT a second copy of
      # its step list — if release:gate changes, this follows automatically.
      # The wrapper only makes the failure PUBLIC (see the header): logs are
      # admin-only, annotations are not.
      - name: release:gate
        run: |
          set -o pipefail
          if pnpm run release:gate 2>&1 | tee gate.log; then
            exit 0
          fi
          echo "::error::release:gate FAILED — the failing tail follows, so it is readable without admin rights"
          tail -n 40 gate.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
